name: Build VideoMarkdown APK

on:
  push:
    branches:
      - build/video-markdown-android-apk
    paths:
      - "android/**"
      - ".github/workflows/build-video-markdown-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          mkdir -p android-work
          base64 --decode android/VideoMarkdown-Android-Source.tar.gz.b64 | tar -xz -C android-work
          test -f android-work/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-work
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoMarkdown-Android-APK
          path: android-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
